# yabench config example
# Run `yabench --init` to create yabench.yaml from this template

# Auth providers — define once, reference by name in tasks
auth:
  # Huawei Cloud IAM (auto-fetches token before each run)
  hw-iam:
    type: iam
    iam_url: https://iam.cn-north-4.myhuaweicloud.com
    domain: your-account-name
    username: your-username
    password: ${IAM_PASSWORD}
    project: cn-north-4

  local-iam:
    type: iam
    iam_url: https://iam.some-org.com
    domain: your-account-name
    username: your-username
    password: ${IAM_PASSWORD}
    project: cn-global-1

  # API key (Authorization: Bearer header)
  api_key:
    type: api_key
    api_key: <API_KEY>

# Global defaults (inherited by all tasks)
defaults:
  num_requests: 10
  concurrency: 1
  max_tokens: 256
  input_tokens: 100
  timeout: 120
  no_verify_ssl: true

# Benchmark tasks
tasks:
  local:
    base_url: http://localhost:8000/v1
    model: my-model
    auth: local-iam

  huaweicloud:
    base_url: https://your-endpoint/v1
    model: placeholder
    auth: hw-iam
    dataset: alpaca-zh
    concurrency: 4

  # Custom dataset from local file
  custom:
    base_url: http://localhost:8000/v1
    dataset: /path/to/prompts.jsonl
    shuffle: true
