# yabench config example
# Run `yabench --init` to create yabench.yaml from this template

# Auth providers — define once, reference by name in tasks
auth:
  # Huawei Cloud IAM (auto-fetches token before each run)
  hw-iam:
    type: iam
    iam_url: https://iam.cn-north-4.myhuaweicloud.com
    domain: your-account-name
    username: your-username
    password: ${IAM_PASSWORD}
    project: cn-north-4

  local-iam:
    type: iam
    iam_url: https://iam.some-org.com
    domain: your-account-name
    username: your-username
    password: ${IAM_PASSWORD}
    project: cn-global-1

  # API key (Authorization: Bearer header)
  api_key:
    type: api_key
    api_key: <API_KEY>

# Global defaults (inherited by all tasks)
# `max_tokens` and `input_tokens` accept size suffixes: 4K, 32K, 128K, 1M
defaults:
  num_requests: 10
  concurrency: 1
  max_tokens: 256
  # input_tokens: 0 (default) → prompts come from sharegpt multi-turn replay.
  # Set to a positive value (e.g. 128K) to pad sharegpt content to that
  # exact token count per request. Omit entirely to keep the default.
  timeout: 120
  no_verify_ssl: true
  # warmup: number of warm-up requests sent before measurement (discarded from
  #   metrics). IMPORTANT for fair TTFT: the first request to a fresh server
  #   pays one-time cold-start cost (kernel/JIT/spec-decode warmup) that
  #   otherwise inflates the TTFT mean. ais_bench defaults to 1 warmup; set
  #   `warmup: 1` to match it. This — not request_rate — is what aligns yabench
  #   with ais_bench (a closed-loop, no-pacing benchmark).
  # request_rate: steady-state arrival pacing (requests/sec). Omitted = burst /
  #   closed-loop (release up to `concurrency`, refill as they drain — this is
  #   what ais_bench does). Set a rate to match vLLM bench's `--request-rate`
  #   (paced Poisson-ish arrival) instead. NOTE: request_rate does NOT replicate
  #   ais_bench; for ais_bench use burst + warmup:1.
  # ignore_eos: when true, sends `ignore_eos: true` so the server generates
  #   exactly `max_tokens` instead of stopping early at EOS. Matches vLLM
  #   bench `--ignore-eos`; needed for comparable output-throughput / E2E.

# Benchmark tasks
tasks:
  local:
    base_url: http://localhost:8000/v1
    model: my-model
    auth: local-iam

  huaweicloud:
    base_url: https://your-endpoint/v1
    model: placeholder
    auth: hw-iam
    dataset: alpaca-zh
    concurrency: 4

  # Custom dataset from local file
  custom:
    base_url: http://localhost:8000/v1
    dataset: /path/to/prompts.jsonl
    shuffle: true

  # Aligning with ais_bench (closed-loop, concurrency-8, 1 warmup): fixed
  # 1K-in/256-out, burst arrival, 1 warmup, exact-length generation. Validated:
  # yabench's TTFT/ITL/TPOT land on ais_bench's within noise. `warmup: 1` is the
  # key knob — it absorbs first-request cold-start that otherwise inflates TTFT.
  align-test:
    base_url: http://localhost:8000/v1
    model: my-model
    input_tokens: 1K
    max_tokens: 256
    concurrency: 8
    num_requests: 50
    warmup: 1
    ignore_eos: true

  # Aligning with `vllm bench serve --request-rate R`: same as above but PACED
  # (steady-state arrival) instead of closed-loop. Set request_rate to vLLM's R.
  align-test-paced:
    base_url: http://localhost:8000/v1
    model: my-model
    input_tokens: 1K
    max_tokens: 256
    concurrency: 8
    num_requests: 50
    warmup: 1
    request_rate: 1.85
    ignore_eos: true

  # Long-context test: each request is padded to ~128K tokens of real
  # ShareGPT content. Concurrency=1 because long prefill dominates wall time.
  long-context-128k:
    base_url: http://localhost:8000/v1
    model: my-model
    input_tokens: 128K
    max_tokens: 1K
    concurrency: 1
    num_requests: 3
    timeout: 600

  # 1M-context smoke test. Increase timeout — prefill at this size is slow.
  long-context-1m:
    base_url: http://localhost:8000/v1
    model: my-model
    input_tokens: 1M
    max_tokens: 1K
    concurrency: 1
    num_requests: 1
    timeout: 1800

# Performance matrix examples (run with --perf-matrix):
#
#   yabench local --perf-matrix
#     Uses default grid: input [1K,4K,16K,64K,128K] × output [256,1K,4K,16K,64K] × c [1,4,8]
#
#   yabench local --perf-matrix --matrix-n 20
#     20 requests per cell instead of the default 10
#
#   yabench local --perf-matrix --matrix-input 1K,4K,32K --matrix-output 256,1K,8K --matrix-concurrency 1,4
#     Custom grid: 3×3×2 = 18 cells
#
#   yabench local --perf-matrix --timeout 600
#     Increase timeout for cells with long input + long output
