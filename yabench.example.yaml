# yabench config example
# Run `yabench --init` to create yabench.yaml from this template

# Auth providers — define once, reference by name in tasks
auth:
  # Huawei Cloud IAM (auto-fetches token before each run)
  hw-iam:
    type: iam
    iam_url: https://iam.cn-north-4.myhuaweicloud.com
    domain: your-account-name
    username: your-username
    password: ${IAM_PASSWORD}
    project: cn-north-4

  local-iam:
    type: iam
    iam_url: https://iam.some-org.com
    domain: your-account-name
    username: your-username
    password: ${IAM_PASSWORD}
    project: cn-global-1

  # API key (Authorization: Bearer header)
  api_key:
    type: api_key
    api_key: <API_KEY>

# Global defaults (inherited by all tasks)
# `max_tokens` and `input_tokens` accept size suffixes: 4K, 32K, 128K, 1M
defaults:
  num_requests: 10
  concurrency: 1
  max_tokens: 256
  # input_tokens: 0 (default) → prompts come from sharegpt multi-turn replay.
  # Set to a positive value (e.g. 128K) to pad sharegpt content to that
  # exact token count per request. Omit entirely to keep the default.
  timeout: 120
  no_verify_ssl: true

# Benchmark tasks
tasks:
  local:
    base_url: http://localhost:8000/v1
    model: my-model
    auth: local-iam

  huaweicloud:
    base_url: https://your-endpoint/v1
    model: placeholder
    auth: hw-iam
    dataset: alpaca-zh
    concurrency: 4

  # Custom dataset from local file
  custom:
    base_url: http://localhost:8000/v1
    dataset: /path/to/prompts.jsonl
    shuffle: true

  # Long-context test: each request is padded to ~128K tokens of real
  # ShareGPT content. Concurrency=1 because long prefill dominates wall time.
  long-context-128k:
    base_url: http://localhost:8000/v1
    model: my-model
    input_tokens: 128K
    max_tokens: 1K
    concurrency: 1
    num_requests: 3
    timeout: 600

  # 1M-context smoke test. Increase timeout — prefill at this size is slow.
  long-context-1m:
    base_url: http://localhost:8000/v1
    model: my-model
    input_tokens: 1M
    max_tokens: 1K
    concurrency: 1
    num_requests: 1
    timeout: 1800

# Performance matrix examples (run with --perf-matrix):
#
#   yabench local --perf-matrix
#     Uses default grid: input [1K,4K,16K,64K,128K] × output [256,1K,4K,16K,64K] × c [1,4,8]
#
#   yabench local --perf-matrix --matrix-n 20
#     20 requests per cell instead of the default 10
#
#   yabench local --perf-matrix --matrix-input 1K,4K,32K --matrix-output 256,1K,8K --matrix-concurrency 1,4
#     Custom grid: 3×3×2 = 18 cells
#
#   yabench local --perf-matrix --timeout 600
#     Increase timeout for cells with long input + long output
