[package]
name = "yabench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "yabench"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
indicatif = "0.17"
console = "0.15"
anyhow = "1"
futures = "0.3"
tokio-stream = "0.1"
dirs = "5"
